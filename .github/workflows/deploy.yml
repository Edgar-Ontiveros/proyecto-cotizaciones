name: Deploy to AWS

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: cotiza-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production        # OBLIGATORIO: la confianza del rol lo exige
    permissions:
      id-token: write              # OBLIGATORIO: sin esto no hay token OIDC
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Configurar credenciales AWS vía OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::588301175237:role/GitHubActionsDeployRole
          role-session-name: gha-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir y publicar imagen
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$TAG .
          docker push $REGISTRY/$ECR_REPOSITORY:$TAG

      - name: Desplegar en la EC2 vía Session Manager
        run: |
          CMD=$(aws ssm send-command \
            --targets "Key=tag:Project,Values=cotizaciones" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd /opt/cotiza && ./deploy.sh ${{ github.sha }}"]' \
            --comment "Deploy ${{ github.sha }}" \
            --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$CMD" \
            --instance-id i-093012f3232a60d87
          aws ssm get-command-invocation --command-id "$CMD" \
            --instance-id i-093012f3232a60d87 \
            --query 'StandardOutputContent' --output text
