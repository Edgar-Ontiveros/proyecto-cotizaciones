name: Deploy to AWS

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: cotiza-api
  # F16a.2: bucket de respaldos; su carpeta bootstrap/ es la vía del RUNBOOK
  # para llevar artefactos de infra/ a la EC2 (la instancia no ve GitHub).
  BOOTSTRAP_BUCKET: cotiza-prod-s3-backups-588301175237

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production        # OBLIGATORIO: la confianza del rol lo exige
    permissions:
      id-token: write              # OBLIGATORIO: sin esto no hay token OIDC
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Configurar credenciales AWS vía OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::588301175237:role/GitHubActionsDeployRole
          role-session-name: gha-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir y publicar imagen
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$TAG .
          docker push $REGISTRY/$ECR_REPOSITORY:$TAG

      # F16a.2: el deploy.sh de la EC2 se quedó viejo (sin el bloque HANA) y
      # producción corrió semanas con la fuente Fake. Cada deploy sube el del
      # repo al bootstrap de S3 y la EC2 lo sincroniza ANTES de ejecutarlo.
      - name: Publicar deploy.sh del repo en el bootstrap de S3
        run: |
          aws s3 cp infra/deploy.sh "s3://$BOOTSTRAP_BUCKET/bootstrap/deploy.sh"

      - name: Desplegar en la EC2 vía Session Manager
        run: |
          CMD=$(aws ssm send-command \
            --targets "Key=tag:Project,Values=cotizaciones" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["set -e","cd /opt/cotiza","aws s3 cp s3://${{ env.BOOTSTRAP_BUCKET }}/bootstrap/deploy.sh /opt/cotiza/deploy.sh","chmod +x /opt/cotiza/deploy.sh","md5sum /opt/cotiza/deploy.sh","./deploy.sh ${{ github.sha }}"]' \
            --comment "Deploy ${{ github.sha }}" \
            --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$CMD" \
            --instance-id i-093012f3232a60d87
          aws ssm get-command-invocation --command-id "$CMD" \
            --instance-id i-093012f3232a60d87 \
            --query 'StandardOutputContent' --output text
