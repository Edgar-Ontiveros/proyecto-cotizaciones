[project]
name = "cotizaciones-backend"
version = "0.1.0"
description = "Sistema de cotizaciones de pedido especial — Herinox"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "psycopg[binary]>=3.1,<4.0",
    "pyjwt>=2.8,<3.0",
    "argon2-cffi>=23.1",
    "structlog>=24.1",
    "apscheduler>=3.10,<4.0",
    "openpyxl>=3.1,<4.0",
    "boto3>=1.34,<2.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10,<2.0",
    "httpx>=0.27,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing:skip-covered"
filterwarnings = ["ignore::DeprecationWarning:boto3"]

[tool.coverage.run]
omit = ["app/scheduler/*"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

# openpyxl y apscheduler no publican stubs y sus paquetes types-* serían
# dependencias nuevas (prohibido sin autorización): se ignoran solo sus
# imports.
[[tool.mypy.overrides]]
module = ["openpyxl.*", "apscheduler.*"]
ignore_missing_imports = true

# mypy "strict" solo para app/core/* (CLAUDE.md); el resto en modo normal.
[[tool.mypy.overrides]]
module = "app.core.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_untyped_calls = true
disallow_any_generics = true
disallow_subclassing_any = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
